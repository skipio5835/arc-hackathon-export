name: Security CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test dependency security and SDK compatibility
        run: npm run test-dependency-security

      - name: Test pre-push gate
        run: npm run test-pre-push

      - name: Reject all dependency advisories
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Test Arc Radar
        run: npm run test-arc-radar

      - name: Test server security boundaries
        run: npm run test-security-js

      - name: Compile existing demo contracts
        run: npm run compile-custom
